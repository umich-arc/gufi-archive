# Build the gufi-archive container image and publish it to GHCR.
#
# - Pushes to master: build, smoke test, push master and latest
# - Pull requests touching the image: build, smoke test, push pr-N for testing
#   (only from branches in this repo; fork PRs get a read-only token)
# - Published releases: build, smoke test, push vX.Y.Z, X.Y and (unless a
#   pre-release) latest
# - Manual run (Actions tab): build, smoke test, push a branch-named tag
name: container

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "docker/**"
      - "reports/**"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # PR images are pushed only for branches in this repo, never for forks
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  IMAGE: ghcr.io/umich-arc/gufi-archive

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
          # No releases exist yet, so master pushes move latest too
          flavor: |
            latest=${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'release' && !github.event.release.prerelease) }}

      # Build once into the local daemon so it can be tested before anything is pushed
      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: gufi-archive:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker/smoke-test.sh gufi-archive:test

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the cached layers from the Build step, so this only pushes
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # PR images are deleted on close (container-cleanup.yml); without an
          # attestation each is a single package version, so nothing is orphaned
          provenance: ${{ github.event_name != 'pull_request' }}
